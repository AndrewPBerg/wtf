project: WorkTreeForage (wtf)
repo: github.com/AndrewPBerg/wtf
binary: wtf
description: >
  A fast, opinionated git worktree workflow tool with forge integrations,
  automated project setup, and abus-ready JSON output.

milestones:
  - version: v0.1.0
    title: Core Worktree Operations
    status: in-progress
    goals:
      - Solid internal/git/ foundation everything else builds on
      - Read and write worktree operations
      - Clean, tested CLI surface for day-to-day use
    commands:
      - name: wtf ls
        description: List all worktrees with status
        flags:
          - --json # machine-readable output for abus
      - name: wtf new <branch>
        description: Create a new worktree at a managed location
        flags:
          - --base <branch> # default: main
          - --bare # skip all setup
      - name: wtf sw <branch>
        description: Switch to a worktree (fuzzy match)
      - name: wtf rm <branch>
        description: Remove a worktree and clean up
        flags:
          - --force
      - name: wtf clean
        description: Remove merged or stale worktrees
        flags:
          - --dry-run
          - --force
      - name: wtf version
        description: Print version
        status: done
    internals:
      - internal/git/ # ListWorktrees, AddWorktree, RemoveWorktree
      - internal/cli/ # cobra wiring
    quality:
      - 90% test coverage gate
      - integration tests against real temp git repos
      - golangci-lint passing
      - task all green

  - version: v0.2.0
    title: Setup Automation
    status: planned
    goals:
      - Zero-friction worktree setup — no manual pnpm install or .env copying
      - Declarative .wt-forge.toml per project
      - Auto-detect package manager and env files
    features:
      - auto-detect package manager from lockfile:
          - pnpm-lock.yaml  → pnpm install
          - bun.lockb       → bun install
          - package-lock.json → npm install
          - yarn.lock       → yarn install
          - uv.lock         → uv sync
          - pyproject.toml  → uv sync
          - requirements.txt → pip install
      - env file handling:
          strategy: symlink # symlink | copy | none
          files:
            - .env
            - .env.local
            - .env.development
            - .env.development.local
      - wt-forge.toml support:
          sections:
            - worktree # root path, default base branch
            - env # strategy and file list
            - setup # ordered steps with optional if-conditions
            - hooks # on_create, on_switch, on_remove
      - setup conditions (if-DSL):
          - "branch contains 'feature'"
          - "file exists 'path'"
          - "env VAR is set"
      - wtf setup command:
          description: Re-run setup steps on existing worktree
          flags:
            - --env
            - --install
    commands:
      - name: wtf setup
        description: Re-run setup steps on current worktree
        flags:
          - --env
          - --install
    internals:
      - internal/config/ # .wt-forge.toml loading and validation
      - internal/setup/ # package manager detection, env symlinking, hooks

  - version: v0.3.0
    title: Forge Integration (GitHub & GitLab)
    status: planned
    goals:
      - Checkout PRs directly as worktrees
      - See open PR status inline in wtf ls
      - Fast completions backed by cached PR list
    features:
      - forge auto-detection from origin remote URL:
          - github.com  → GitHub API via gh token
          - gitlab.com  → GitLab API via glab token
          - self-hosted → configured via .wt-forge.toml
      - wt-forge.toml forge config:
          provider: auto # auto | github | gitlab
          host: ~ # for self-hosted instances
      - auth: reuse existing gh / glab tokens, no custom credential management
      - PR list cache:
          ttl: 5m
          location: .git/wtf/pr-cache.json
          strategy: stale-while-revalidate
      - wtf ls --prs shows PR number, title, author, age, review status
    commands:
      - name: wtf pr <number|branch>
        description: Checkout a PR as a worktree
        examples:
          - wtf pr 423
          - wtf pr feature/auth
      - name: wtf ls --prs
        description: List worktrees with PR status inline
    completions:
      - wtf pr <TAB>  →  open PRs with number, branch, author, age
      - wtf sw <TAB>  →  active worktrees
      - wtf rm <TAB>  →  active worktrees
      - wtf new <TAB> →  remote branches not yet checked out
      - wtf clean <TAB> → merged/stale worktrees
    internals:
      - internal/forge/ # GitHub + GitLab API clients
      - internal/cache/ # branch list + PR list caching

  - version: v0.4.0
    title: abus-Ready & Polish
    status: planned
    goals:
      - Every command has --json output for abus consumption
      - Shell completions fully working across bash, zsh, fish
      - Dogfooded on this repo, README quickstart verified
    features:
      - --json flag on all commands (machine-readable, stable schema)
      - wtf completions <shell> command
      - background branch/PR cache refresh
      - wtf doctor — health check (git version, gh/glab auth, token scopes)
      - CONTRIBUTING.md and docs/ complete
      - GitHub Actions CI with coverage gate and lint
    commands:
      - name: wtf completions <shell>
        description: Generate shell completion script
        shells: [bash, zsh, fish]
      - name: wtf doctor
        description: Verify environment health (git, gh/glab, tokens)
    internals:
      - completion dynamic hooks for branch and PR names
      - JSON output layer across all commands

principles:
  - All business logic in internal/ — never in cmd/
  - No global state — pass dependencies explicitly
  - Table-driven tests as default pattern
  - Errors wrapped with context: fmt.Errorf("doing X", err)
  - 90% test coverage enforced in CI at every milestone
  - Changelog updated with every PR
  - docs/ has one markdown per command, updated as commands ship
