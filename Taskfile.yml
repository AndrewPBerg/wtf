version: "3"

tasks:
  build:
    desc: Build WTF without replacing the installed binary
    cmds:
      - GOMAXPROCS=1 go build -p 1 -o bin/wtf ./cmd/wtf
  test:
    desc: Run the contract and lifecycle tests
    cmds:
      - GOMAXPROCS=1 go test -p 1 ./internal/...
  check:
    desc: Validate WTF with one build worker
    cmds:
      - GOMAXPROCS=1 go vet -p 1 ./internal/...
      - GOMAXPROCS=1 go test -p 1 ./internal/...
