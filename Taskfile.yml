version: "3"

tasks:
  build:
    desc: Build the local V1 pilot without replacing installed WTF
    cmds:
      - go build -p 1 -o bin/wtf-pilot ./cmd/wtf
  test:
    desc: Run the focused pilot contract and lifecycle tests
    cmds:
      - go test -p 1 ./internal/...
  check:
    desc: Validate the pilot with one build worker
    cmds:
      - go vet -p 1 ./internal/...
      - go test -p 1 ./internal/...
