version: "3"

vars:
  BINARY: wtf
  BUILD_DIR: bin
  COVER_PROFILE: coverage.out
  MIN_COVERAGE: 75
  VERSION: 0.11.2

tasks:
  build:
    desc: Build the binary
    cmds:
      - go build -ldflags "-X github.com/AndrewPBerg/wtf/internal/cli.Version={{.VERSION}}" -o {{.BUILD_DIR}}/{{.BINARY}} ./cmd/wtf

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test-coverage:
    desc: Run tests with coverage report, fail below threshold
    cmds:
      # Only measure internal/ packages — cmd/wtf is just the main() entry point.
      - go test -coverprofile={{.COVER_PROFILE}} ./internal/...
      - go tool cover -func={{.COVER_PROFILE}}
      - go tool cover -html={{.COVER_PROFILE}} -o coverage.html
      - scripts/coverage-check.sh {{.COVER_PROFILE}} {{.MIN_COVERAGE}}

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format code with gofmt
    cmds:
      - gofmt -w .

  tidy:
    desc: Clean up go.mod and go.sum
    cmds:
      - go mod tidy

  pi-extension-check:
    desc: Check the canonical Pi extension
    dir: packages/pi-extension
    cmds:
      - pnpm check

  pi-extension-install:
    desc: Install the canonical Pi extension locally
    cmds:
      - ./scripts/install-pi-extension.sh

  all:
    desc: Format, lint, test, and build
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: build

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
      - rm -f {{.COVER_PROFILE}} coverage.html
