name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.46.0
      - name: Lint and test
        env:
          GOMAXPROCS: 1
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          golangci-lint run --concurrency 1
          go test -p 1 ./cmd/...
          go test -p 1 -coverprofile=coverage.out ./internal/...
          scripts/coverage-check.sh coverage.out 75
      - name: Verify version and release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -s "docs/releases/${VERSION}.md"
          grep -Fx "var Version = \"${VERSION}\"" internal/cli/cli.go

  build:
    name: Build (linux_${{ matrix.arch }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        arch: [amd64, arm64, arm, "386"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GOARM: "7"
          CGO_ENABLED: 0
          GOMAXPROCS: 1
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -p 1 -trimpath \
            -ldflags="-s -w -X github.com/AndrewPBerg/wtf/internal/cli.Version=${VERSION}" \
            -o wtf ./cmd/wtf
          if [ "$GOARCH" = amd64 ]; then
            test "$(./wtf version)" = "WTF ${VERSION}"
          fi
      - name: Package supported executable and documentation
        run: tar czf "wtf_linux_${{ matrix.arch }}.tar.gz" wtf README.md LICENSE docs examples scripts/wtf.bash
      - uses: actions/upload-artifact@v7
        with:
          name: wtf_linux_${{ matrix.arch }}
          path: wtf_linux_${{ matrix.arch }}.tar.gz
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums and select release notes
        id: release
        run: |
          (cd dist && sha256sum *.tar.gz) > SHA256SUMS
          echo "notes=docs/releases/${GITHUB_REF_NAME#v}.md" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ steps.release.outputs.notes }}
          files: |
            dist/*.tar.gz
            SHA256SUMS
