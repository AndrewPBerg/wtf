name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Install Jujutsu
        uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.46.0

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1

      - name: Lint
        run: GOMAXPROCS=1 golangci-lint run --concurrency 1

      - name: Test
        run: GOMAXPROCS=1 go test -p 1 ./cmd/...

      - name: Enforce adjusted coverage gate
        run: |
          GOMAXPROCS=1 go test -p 1 -coverprofile=coverage.out ./internal/...
          scripts/coverage-check.sh coverage.out 75

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          fail_ci_if_error: false
